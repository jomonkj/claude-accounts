name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      HAS_CERT: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tests
        run: |
          tests/engine_test.sh
          tests/crash_test.sh
          tests/sync_property_test.py 500
          swift run CoreTests
      - name: Build
        run: scripts/build.sh "${GITHUB_REF_NAME#v}"
      - name: Check architectures
        run: '[ "$(lipo -archs "build/Claude Accounts.app/Contents/MacOS/ClaudeAccounts")" = "x86_64 arm64" ]'
      # Runs only when a Developer ID certificate is stored in the repo secrets.
      - name: Sign and notarize
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          security list-keychains -s build.keychain
          security unlock-keychain -p ci build.keychain
          codesign --force --deep --options runtime --timestamp -s "$IDENTITY" "build/Claude Accounts.app"
          ditto -c -k --keepParent "build/Claude Accounts.app" notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple "build/Claude Accounts.app"
      - name: Package
        run: |
          ditto -c -k --keepParent "build/Claude Accounts.app" "Claude-Accounts-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "Claude-Accounts-${GITHUB_REF_NAME}.zip" > "Claude-Accounts-${GITHUB_REF_NAME}.zip.sha256"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            "Claude-Accounts-${GITHUB_REF_NAME}.zip" "Claude-Accounts-${GITHUB_REF_NAME}.zip.sha256" \
            scripts/install-release.sh
